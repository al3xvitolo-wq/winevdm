name: build-printfix

on:
  workflow_dispatch:
  push:
    branches: [ printfix ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (provides as.exe/objcopy.exe used by the 16-bit thunk generator)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: binutils
          update: true

      - name: Locate MSYS2 root and sanity-check assembler
        id: msys2root
        shell: msys2 {0}
        run: |
          which as
          which objcopy
          as --version
          root=$(cygpath -w /usr/bin)
          echo "Resolved Windows path: $root"
          ghout=$(cygpath -u "$GITHUB_OUTPUT")
          echo "bindir=$root" >> "$ghout"

      - name: Detect installed Windows 10 SDK version
        id: sdk
        shell: pwsh
        run: |
          $versions = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending
          $ver = $versions[0].Name
          Write-Host "Using SDK $ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Write PropertySheet.props (build-time only, not committed)
        shell: pwsh
        run: |
          $sdk = "${{ steps.sdk.outputs.version }}"
          $asmPath = "${{ steps.msys2root.outputs.bindir }}\"
          $content = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Project ToolsVersion="4.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ImportGroup Label="PropertySheets" />
            <PropertyGroup Label="UserMacros">
              <AsmPath>$asmPath</AsmPath>
              <NtDllLibPath>`$(UniversalCRTSdkDir)Lib\$sdk\um\x86\</NtDllLibPath>
            </PropertyGroup>
            <PropertyGroup>
              <_PropertySheetDisplayName>MacroPropertySheet</_PropertySheetDisplayName>
              <IncludePath>`$(SolutionDir)wow32;`$(IncludePath)</IncludePath>
            </PropertyGroup>
            <ItemDefinitionGroup>
              <ClCompile>
                <RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>
                <WarningLevel>TurnOffAllWarnings</WarningLevel>
              </ClCompile>
            </ItemDefinitionGroup>
            <ItemGroup>
              <BuildMacro Include="AsmPath">
                <Value>`$(AsmPath)</Value>
              </BuildMacro>
              <BuildMacro Include="NtDllLibPath">
                <Value>`$(NtDllLibPath)</Value>
              </BuildMacro>
            </ItemGroup>
          </Project>
          "@
          Set-Content -Path PropertySheet.props -Value $content -Encoding utf8

      - name: Install VS2017 (v141) build tools component
        shell: pwsh
        run: |
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $logFile = "$env:RUNNER_TEMP\vs_installer.log"
          $p = Start-Process -FilePath $vsInstaller -ArgumentList @(
            "modify",
            "--installPath", $installPath,
            "--add", "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "--quiet", "--norestart", "--wait",
            "--log", $logFile
          ) -Wait -NoNewWindow -PassThru
          Write-Host "vs_installer exit code: $($p.ExitCode)"
          if (Test-Path $logFile) { Get-Content $logFile -Tail 200 }
          # Verify the toolset is actually there now
          $msvcDir = Join-Path $installPath "VC\Tools\MSVC"
          if (Test-Path $msvcDir) { Get-ChildItem $msvcDir }
          $v141Dir = "C:\Program Files (x86)\Microsoft Visual Studio\2017"
          if (Test-Path $v141Dir) { Write-Host "v141 install found under $v141Dir" } else { Write-Host "No separate VS2017 install tree found" }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build otvdm.sln (Release|Win32)
        shell: cmd
        run: msbuild otvdm.sln /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=${{ steps.sdk.outputs.version }} /m /v:normal

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otvdm-build-output
          path: |
            Release/**
          if-no-files-found: warn
